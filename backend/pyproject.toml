[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# ⚠️ 这里原来写的是 >=3.13，但实际运行的是 3.11（.venv-py311）。
# 这个不一致拖了很久：要么改声明、要么重建环境，二选一。
# 改造 #9 做 Docker 时被迫定下来 —— 选 3.11，因为它是**已知全部依赖可用的版本**
# （今天所有实测都跑在它上面）。改动见 reference/transformation-09-docker-design.md。
#
# ⚠️ 下面的依赖写的是**宽松下界**（>=x.y），这是有意的：
# 精确版本记录在 requirements.lock —— 它是从实际在用的 venv freeze 出来的，Docker 用它。
#
# **因此不要在本目录执行 `uv lock` / `uv sync`。** 实测过：uv 会按宽松下界解析到
# 最新主版本 —— langchain 会锁到 1.x、langgraph 到 1.x，而项目代码是按
# langchain 0.3 / langgraph 0.6 写的，装出来跑不起来。仓库里原本有一个 3.13 时代
# 的 uv.lock（与这里声明的版本直接矛盾），已删除，理由就是这条。
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "aiosqlite>=0.21.0",
    # PostgreSQL 的异步驱动。SQLAlchemy 的 postgresql+asyncpg:// 用它。
    # 选 asyncpg 而不是 psycopg：前者是 SQLAlchemy 官方文档里 async 场景的首选。
    "asyncpg>=0.30.0",
    "chromadb>=0.6.3",
    "cryptography>=45.0.2",
    "dashscope>=1.24.2",
    "fastapi[standard]>=0.115.12",
    "langchain>=0.3.25",
    "langchain-chroma>=0.2.3",
    "langchain-community>=0.3.24",
    "langchain-deepseek>=0.1.3",
    "langchain-ollama>=0.3.3",
    "langchain-openai>=0.3.17",
    "langgraph>=0.5.0",
    "langgraph-supervisor>=0.0.27",
    # 会话记忆落库（改造 #5 之二）：AsyncPostgresSaver。锁 2.x 是因为 3.x 的
    # langgraph-checkpoint 4.x 与本项目 langchain-core 0.3 的 Reviver 不兼容（实测）
    "langgraph-checkpoint-postgres>=2.0.24,<3",
    "psycopg[binary]>=3.3.5",
    # 向量库对比（改造 #6 之二）：默认仍是 Chroma，qdrant 由 VECTOR_STORE 切换
    "qdrant-client>=1.19.0",
    # MCP（改造 #4）：把外部 MCP server 的工具转成 LangChain 工具
    "langchain-mcp-adapters>=0.3.2",
    "mysql-connector-python>=9.3.0",
    "pydantic-settings>=2.9.1",
    "pdfminer.six>=20231228",
    "pymysql>=1.1.1",
    "pypdf>=5.6.0",
    "python-docx>=1.1.0",
    "pyppeteer>=2.0.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.34.2",
]
